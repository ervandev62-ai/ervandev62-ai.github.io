backend:
  name: git-gateway
  branch: main # Atau nama branch utama repositori Anda (misal: master)

media_folder: "public/images/blog"
public_folder: "/images/blog"

collections:
  - name: "blog"
    label: "Artikel Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal Dipublikasi", name: "date", widget: "datetime" }
      - { label: "Gambar Sampul", name: "image", widget: "image" }
      - { label: "Deskripsi Singkat", name: "description", widget: "text" }
      - { label: "Isi Artikel", name: "body", widget: "markdown" }
